<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zeytin Tarla İstatistikleri</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f0;
      color: #1a1a1a;
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    .container {
      max-width: 860px;
      margin: 0 auto;
    }

    header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 2rem;
    }

    .logo-icon {
      width: 40px;
      height: 40px;
      background: #3d6b28;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    header h1 {
      font-size: 20px;
      font-weight: 600;
      color: #1a1a1a;
    }

    header p {
      font-size: 13px;
      color: #888;
      margin-top: 2px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 1.5rem;
    }

    @media (max-width: 600px) {
      .cards { grid-template-columns: repeat(2, 1fr); }
    }

    .card {
      background: #fff;
      border-radius: 12px;
      padding: 1rem 1.125rem;
      border: 1px solid #e8e8e0;
    }

    .card-label {
      font-size: 12px;
      color: #888;
      margin-bottom: 4px;
    }

    .card-val {
      font-size: 24px;
      font-weight: 600;
      color: #1a1a1a;
    }

    .card-sub {
      font-size: 11px;
      color: #aaa;
      margin-top: 3px;
    }

    .filters {
      display: flex;
      gap: 10px;
      margin-bottom: 1rem;
      align-items: center;
      flex-wrap: wrap;
    }

    .filters label {
      font-size: 13px;
      color: #666;
    }

    .filters select {
      font-size: 13px;
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px solid #ddd;
      background: #fff;
      color: #1a1a1a;
      cursor: pointer;
      outline: none;
    }

    .filters select:focus {
      border-color: #5a8a30;
    }

    .table-wrap {
      background: #fff;
      border-radius: 12px;
      border: 1px solid #e8e8e0;
      overflow: hidden;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    thead th {
      font-size: 11px;
      font-weight: 500;
      color: #999;
      text-align: left;
      padding: 10px 14px;
      border-bottom: 1px solid #f0f0e8;
      white-space: nowrap;
      background: #fafaf7;
    }

    tbody td {
      padding: 10px 14px;
      border-bottom: 1px solid #f0f0e8;
      color: #1a1a1a;
    }

    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover td { background: #fafaf7; }

    .badge {
      display: inline-block;
      font-size: 11px;
      padding: 3px 9px;
      border-radius: 999px;
      font-weight: 500;
      margin-right: 3px;
    }

    .sulu { background: #e6f1fb; color: #185fa5; }
    .kuru { background: #faeeda; color: #854f0b; }

    .verim-bar { display: flex; align-items: center; gap: 8px; }
    .bar-bg { flex: 1; height: 6px; background: #eee; border-radius: 3px; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 3px; background: #5a8a30; }

    .empty {
      text-align: center;
      padding: 2.5rem;
      color: #aaa;
      font-size: 13px;
    }

    .ilce-name { font-weight: 500; color: #1a1a1a; }
  </style>
</head>
<body>
  <div class="container">

    <header>
      <div class="logo-icon">🫒</div>
      <div>
        <h1>Zeytin Tarla İstatistikleri</h1>
        <p>Bursa ili — ilçe bazlı özet</p>
      </div>
    </header>

    <div class="cards">
      <div class="card">
        <div class="card-label">Toplam alan</div>
        <div class="card-val" id="c-alan">33.200</div>
        <div class="card-sub" id="c-parsel">m² · 7 parsel</div>
      </div>
      <div class="card">
        <div class="card-label">Ort. verim</div>
        <div class="card-val" id="c-verim">20.1</div>
        <div class="card-sub">kg / ağaç</div>
      </div>
      <div class="card">
        <div class="card-label">En yüksek verim</div>
        <div class="card-val" id="c-max">29</div>
        <div class="card-sub" id="c-max-ilce">Karacabey</div>
      </div>
      <div class="card">
        <div class="card-label">Gösterilen ilçe</div>
        <div class="card-val" id="c-ilce">5</div>
        <div class="card-sub">Bursa ili</div>
      </div>
    </div>

    <div class="filters">
      <label>İlçe:</label>
      <select id="sel-ilce" onchange="filtrele()">
        <option value="">Tümü</option>
        <option>Gemlik</option>
        <option>İznik</option>
        <option>Karacabey</option>
        <option>Mudanya</option>
        <option>Orhangazi</option>
      </select>
      <label style="margin-left:8px">Sulama:</label>
      <select id="sel-sulama" onchange="filtrele()">
        <option value="">Tümü</option>
        <option>Sulu</option>
        <option>Kuru</option>
      </select>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>İlçe</th>
            <th>Parsel sayısı</th>
            <th>Toplam alan (m²)</th>
            <th>Ort. verim (kg/ağaç)</th>
            <th>Sulama</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>

  </div>

  <script>
    const raw = [
      { ilce: 'Mudanya',   alan: 5600, verim: 15, sulama: 'Sulu' },
      { ilce: 'Mudanya',   alan: 6000, verim: 18, sulama: 'Kuru' },
      { ilce: 'Gemlik',    alan: 5000, verim: 17, sulama: 'Kuru' },
      { ilce: 'Karacabey', alan: 7000, verim: 29, sulama: 'Sulu' },
      { ilce: 'Karacabey', alan: 2000, verim: 14, sulama: 'Kuru' },
      { ilce: 'İznik',     alan: 2600, verim: 27, sulama: 'Sulu' },
      { ilce: 'Orhangazi', alan: 5000, verim: 21, sulama: 'Sulu' },
    ];

    function grupla(satirlar) {
      const g = {};
      satirlar.forEach(r => {
        if (!g[r.ilce]) g[r.ilce] = { sayi: 0, alan: 0, verimToplam: 0, sulama: new Set() };
        g[r.ilce].sayi++;
        g[r.ilce].alan += r.alan;
        g[r.ilce].verimToplam += r.verim;
        g[r.ilce].sulama.add(r.sulama);
      });
      return g;
    }

    function filtrele() {
      const ilce = document.getElementById('sel-ilce').value;
      const sulama = document.getElementById('sel-sulama').value;
      const filtered = raw.filter(r => (!ilce || r.ilce === ilce) && (!sulama || r.sulama === sulama));
      const groups = grupla(filtered);
      const ilceler = Object.keys(groups).sort();
      const maxVerim = Math.max(...ilceler.map(k => groups[k].verimToplam / groups[k].sayi), 1);

      let html = '';
      if (ilceler.length === 0) {
        html = `<tr><td colspan="5" class="empty">Eşleşen kayıt bulunamadı.</td></tr>`;
      } else {
        ilceler.forEach(k => {
          const g = groups[k];
          const ort = (g.verimToplam / g.sayi).toFixed(1);
          const badges = [...g.sulama].map(s => `<span class="badge ${s === 'Sulu' ? 'sulu' : 'kuru'}">${s}</span>`).join('');
          html += `<tr>
            <td class="ilce-name">${k}</td>
            <td style="color:#999">${g.sayi}</td>
            <td>${g.alan.toLocaleString('tr-TR')}</td>
            <td>
              <div class="verim-bar">
                <span style="min-width:32px">${ort}</span>
                <div class="bar-bg"><div class="bar-fill" style="width:${Math.round(parseFloat(ort)/maxVerim*100)}%"></div></div>
              </div>
            </td>
            <td>${badges}</td>
          </tr>`;
        });
      }
      document.getElementById('tbody').innerHTML = html;

      const toplamAlan = filtered.reduce((s, r) => s + r.alan, 0);
      const ortVerim = filtered.length ? (filtered.reduce((s, r) => s + r.verim, 0) / filtered.length).toFixed(1) : '-';
      const maxV = filtered.length ? Math.max(...filtered.map(r => r.verim)) : '-';
      const maxIlce = filtered.find(r => r.verim === maxV)?.ilce || '-';

      document.getElementById('c-alan').textContent = toplamAlan.toLocaleString('tr-TR');
      document.getElementById('c-parsel').textContent = `m² · ${filtered.length} parsel`;
      document.getElementById('c-verim').textContent = ortVerim;
      document.getElementById('c-max').textContent = maxV;
      document.getElementById('c-max-ilce').textContent = maxIlce;
      document.getElementById('c-ilce').textContent = ilceler.length;
    }

    filtrele();
  </script>
</body>
</html>
