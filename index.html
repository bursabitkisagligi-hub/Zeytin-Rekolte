<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zeytin Tarla İstatistikleri</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f0; color: #1a1a1a; min-height: 100vh; padding: 2rem 1rem; }
    .container { max-width: 920px; margin: 0 auto; }
    header { display: flex; align-items: center; gap: 14px; margin-bottom: 2rem; }
    .logo-icon { width: 48px; height: 48px; background: #3d6b28; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 24px; flex-shrink: 0; }
    header h1 { font-size: 22px; font-weight: 600; }
    header p { font-size: 13px; color: #888; margin-top: 2px; }
    .cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 1.5rem; }
    @media (max-width: 600px) { .cards { grid-template-columns: repeat(2, 1fr); } }
    .card { background: #fff; border-radius: 12px; padding: 1rem 1.25rem; border: 1px solid #e8e8e0; }
    .card-label { font-size: 12px; color: #888; margin-bottom: 4px; }
    .card-val { font-size: 26px; font-weight: 600; }
    .card-sub { font-size: 11px; color: #aaa; margin-top: 3px; }
    .filters { display: flex; gap: 10px; margin-bottom: 1rem; align-items: center; flex-wrap: wrap; }
    .filters label { font-size: 13px; color: #666; }
    .filters select { font-size: 13px; padding: 6px 10px; border-radius: 8px; border: 1px solid #ddd; background: #fff; color: #1a1a1a; cursor: pointer; outline: none; }
    .filters select:focus { border-color: #5a8a30; }
    .table-wrap { background: #fff; border-radius: 12px; border: 1px solid #e8e8e0; overflow: hidden; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    thead th { font-size: 11px; font-weight: 500; color: #999; text-align: left; padding: 10px 14px; border-bottom: 1px solid #f0f0e8; white-space: nowrap; background: #fafaf7; }
    tbody td { padding: 10px 14px; border-bottom: 1px solid #f0f0e8; }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover td { background: #fafaf7; }
    .badge { display: inline-block; font-size: 11px; padding: 3px 9px; border-radius: 999px; font-weight: 500; margin-right: 3px; }
    .sulu { background: #e6f1fb; color: #185fa5; }
    .kuru { background: #faeeda; color: #854f0b; }
    .verim-bar { display: flex; align-items: center; gap: 8px; }
    .bar-bg { flex: 1; height: 6px; background: #eee; border-radius: 3px; overflow: hidden; min-width: 60px; }
    .bar-fill { height: 100%; border-radius: 3px; background: #5a8a30; }
    .empty { text-align: center; padding: 2.5rem; color: #aaa; font-size: 13px; }
    .ilce-name { font-weight: 500; }
  </style>
</head>
<body>
<div class="container">
  <header>
    <div class="logo-icon">🫒</div>
    <div>
      <h1>Zeytin Tarla İstatistikleri</h1>
      <p>Bursa ili — ilçe bazlı özet</p>
    </div>
  </header>

  <div class="cards">
    <div class="card"><div class="card-label">Toplam alan</div><div class="card-val" id="c-alan">-</div><div class="card-sub" id="c-parsel">m²</div></div>
    <div class="card"><div class="card-label">Ort. verim</div><div class="card-val" id="c-verim">-</div><div class="card-sub">kg / ağaç</div></div>
    <div class="card"><div class="card-label">En yüksek verim</div><div class="card-val" id="c-max">-</div><div class="card-sub" id="c-max-ilce">-</div></div>
    <div class="card"><div class="card-label">Gösterilen ilçe</div><div class="card-val" id="c-ilce">-</div><div class="card-sub" id="c-sezon-label">Bursa ili</div></div>
  </div>

  <div class="filters">
    <label>Yıl:</label>
    <select id="sel-yil" onchange="filtrele()"></select>
    <label style="margin-left:8px">İlçe:</label>
    <select id="sel-ilce" onchange="filtrele()">
      <option value="">Tümü</option>
      <option>Gemlik</option><option>İznik</option><option>Karacabey</option>
      <option>Kestel</option><option>Mudanya</option><option>Mustafakemalpaşa</option>
      <option>Nilüfer</option><option>Orhangazi</option><option>Osmangazi</option>
    </select>
    <label style="margin-left:8px">Sulama:</label>
    <select id="sel-sulama" onchange="filtrele()">
      <option value="">Tümü</option>
      <option>Sulu</option><option>Kuru</option>
    </select>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>İlçe</th><th>Parsel sayısı</th><th>Toplam alan (m²)</th>
          <th>Ort. verim (kg/ağaç)</th><th>Sulama</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

<script>
const raw = [
  {ilce:"Osmangazi", alan:1100,  verim:15, sulama:"Sulu", yil:2025},
  {ilce:"Osmangazi", alan:12600, verim:8,  sulama:"Kuru", yil:2025},
  {ilce:"Osmangazi", alan:9200,  verim:10, sulama:"Kuru", yil:2025},
  {ilce:"Gemlik",    alan:5650,  verim:14, sulama:"Kuru", yil:2025},
  {ilce:"Gemlik",    alan:56100, verim:13, sulama:"Kuru", yil:2025},
  {ilce:"Gemlik",    alan:13400, verim:14, sulama:"Kuru", yil:2025},
  {ilce:"Gemlik",    alan:4050,  verim:18, sulama:"Kuru", yil:2025},
  {ilce:"Gemlik",    alan:1300,  verim:14, sulama:"Sulu", yil:2025},
  {ilce:"Gemlik",    alan:1100,  verim:3,  sulama:"Kuru", yil:2025},
  {ilce:"Gemlik",    alan:4150,  verim:7,  sulama:"Kuru", yil:2025},
  {ilce:"Gemlik",    alan:10000, verim:20, sulama:"Sulu", yil:2025},
  {ilce:"Nilüfer",   alan:8000,  verim:13, sulama:"Kuru", yil:2025},
  {ilce:"Nilüfer",   alan:5350,  verim:12, sulama:"Kuru", yil:2025},
  {ilce:"Nilüfer",   alan:30300, verim:12, sulama:"Kuru", yil:2025},
  {ilce:"Mudanya",   alan:8000,  verim:20, sulama:"Kuru", yil:2025},
  {ilce:"Mudanya",   alan:6700,  verim:6,  sulama:"Kuru", yil:2025},
  {ilce:"Mudanya",   alan:3100,  verim:6,  sulama:"Kuru", yil:2025},
  {ilce:"Mudanya",   alan:2600,  verim:7,  sulama:"Sulu", yil:2025},
  {ilce:"Mudanya",   alan:9600,  verim:4,  sulama:"Kuru", yil:2025},
  {ilce:"Mudanya",   alan:59800, verim:18, sulama:"Sulu", yil:2025},
  {ilce:"Mudanya",   alan:6000,  verim:0,  sulama:"Kuru", yil:2025},
  {ilce:"Mudanya",   alan:9400,  verim:10, sulama:"Kuru", yil:2025},
  {ilce:"Mudanya",   alan:2800,  verim:0,  sulama:"Kuru", yil:2025},
  {ilce:"Mudanya",   alan:2700,  verim:6,  sulama:"Kuru", yil:2025},
  {ilce:"Mudanya",   alan:24400, verim:5,  sulama:"Kuru", yil:2025},
  {ilce:"Orhangazi", alan:21600, verim:4,  sulama:"Kuru", yil:2025},
  {ilce:"Orhangazi", alan:13750, verim:10, sulama:"Kuru", yil:2025},
  {ilce:"Orhangazi", alan:3360,  verim:18, sulama:"Sulu", yil:2025},
  {ilce:"Orhangazi", alan:1000,  verim:18, sulama:"Sulu", yil:2025},
  {ilce:"Orhangazi", alan:15000, verim:22, sulama:"Kuru", yil:2025},
  {ilce:"Orhangazi", alan:5000,  verim:22, sulama:"Sulu", yil:2025},
  {ilce:"İznik",     alan:10000, verim:17, sulama:"Sulu", yil:2025},
  {ilce:"İznik",     alan:12250, verim:20, sulama:"Sulu", yil:2025},
  {ilce:"İznik",     alan:5200,  verim:17, sulama:"Sulu", yil:2025},
  {ilce:"İznik",     alan:3900,  verim:15, sulama:"Sulu", yil:2025},
  {ilce:"İznik",     alan:6500,  verim:15, sulama:"Sulu", yil:2025},
  {ilce:"İznik",     alan:9100,  verim:8,  sulama:"Kuru", yil:2025},
  {ilce:"Karacabey", alan:2100,  verim:22, sulama:"Sulu", yil:2025},
  {ilce:"Karacabey", alan:2600,  verim:0,  sulama:"Kuru", yil:2025},
  {ilce:"Karacabey", alan:12500, verim:20, sulama:"Sulu", yil:2025},
  {ilce:"Karacabey", alan:13000, verim:1,  sulama:"Kuru", yil:2025},
  {ilce:"Karacabey", alan:11000, verim:4,  sulama:"Kuru", yil:2025},
  {ilce:"Mustafakemalpaşa", alan:3900, verim:6,  sulama:"Sulu", yil:2025},
  {ilce:"Mustafakemalpaşa", alan:3100, verim:12, sulama:"Sulu", yil:2025},
  {ilce:"Mustafakemalpaşa", alan:8000, verim:6,  sulama:"Kuru", yil:2025},
  {ilce:"Mustafakemalpaşa", alan:8000, verim:22, sulama:"Sulu", yil:2025},
  {ilce:"Kestel",    alan:9950,  verim:4,  sulama:"Kuru", yil:2025},
  {ilce:"Kestel",    alan:5500,  verim:6,  sulama:"Kuru", yil:2025},
  {ilce:"Kestel",    alan:15200, verim:14, sulama:"Sulu", yil:2025},
  {ilce:"Kestel",    alan:7000,  verim:16, sulama:"Sulu", yil:2025},
];

// Yıl filtresini otomatik doldur
const yillar = [...new Set(raw.map(r => r.yil))].sort((a,b) => b-a);
const selYil = document.getElementById('sel-yil');
selYil.innerHTML = '<option value="">Tüm yıllar</option>' +
  yillar.map(y => `<option value="${y}">${y}</option>`).join('');

function grupla(satirlar) {
  const g = {};
  satirlar.forEach(r => {
    if (!g[r.ilce]) g[r.ilce] = { sayi:0, alan:0, verimToplam:0, sulama:new Set() };
    g[r.ilce].sayi++;
    g[r.ilce].alan += r.alan;
    g[r.ilce].verimToplam += r.verim;
    g[r.ilce].sulama.add(r.sulama);
  });
  return g;
}

function filtrele() {
  const yil    = document.getElementById('sel-yil').value;
  const ilce   = document.getElementById('sel-ilce').value;
  const sulama = document.getElementById('sel-sulama').value;

  const filtered = raw.filter(r =>
    (!yil    || r.yil === parseInt(yil)) &&
    (!ilce   || r.ilce === ilce) &&
    (!sulama || r.sulama === sulama)
  );

  const groups  = grupla(filtered);
  const ilceler = Object.keys(groups).sort();
  const maxVerim = Math.max(...ilceler.map(k => groups[k].verimToplam / groups[k].sayi), 1);

  let html = '';
  if (!ilceler.length) {
    html = `<tr><td colspan="5" class="empty">Eşleşen kayıt bulunamadı.</td></tr>`;
  } else {
    ilceler.forEach(k => {
      const g   = groups[k];
      const ort = (g.verimToplam / g.sayi).toFixed(1);
      const badges = [...g.sulama].map(s =>
        `<span class="badge ${s==='Sulu'?'sulu':'kuru'}">${s}</span>`).join('');
      html += `<tr>
        <td class="ilce-name">${k}</td>
        <td style="color:#999">${g.sayi}</td>
        <td>${g.alan.toLocaleString('tr-TR')}</td>
        <td><div class="verim-bar">
          <span style="min-width:32px">${ort}</span>
          <div class="bar-bg"><div class="bar-fill" style="width:${Math.round(parseFloat(ort)/maxVerim*100)}%"></div></div>
        </div></td>
        <td>${badges}</td>
      </tr>`;
    });
  }
  document.getElementById('tbody').innerHTML = html;

  const toplamAlan = filtered.reduce((s,r) => s+r.alan, 0);
  const ortVerim   = filtered.length ? (filtered.reduce((s,r)=>s+r.verim,0)/filtered.length).toFixed(1) : '-';
  const maxV       = filtered.length ? Math.max(...filtered.map(r=>r.verim)) : '-';
  const maxIlce    = filtered.find(r=>r.verim===maxV)?.ilce || '-';

  document.getElementById('c-alan').textContent    = toplamAlan.toLocaleString('tr-TR');
  document.getElementById('c-parsel').textContent  = `m² · ${filtered.length} parsel`;
  document.getElementById('c-verim').textContent   = ortVerim;
  document.getElementById('c-max').textContent     = maxV;
  document.getElementById('c-max-ilce').textContent = maxIlce;
  document.getElementById('c-ilce').textContent    = ilceler.length;
  document.getElementById('c-sezon-label').textContent = yil ? `${yil} sezonu` : 'Tüm sezonlar';
}

filtrele();
</script>
</body>
</html>
